[package]
name = "day-01"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "aoc_ffi_day01"

[dependencies]
libc = "0.2"
glib-sys = "0.20"
uniffi = "0.30"
thiserror = "2.0"

[build-dependencies]
cc = "1.0"
uniffi = { version = "0.30", features = ["build"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "aoc_bench"
harness = false
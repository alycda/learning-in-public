[package]
name = "day-01"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "aoc_ffi_day01"

[dependencies]
libc = "0.2"
glib-sys = { version = "0.20", optional = true }
uniffi = "0.28"
thiserror = "1.0"

[features]
default = ["glib"]
glib = ["glib-sys"]

[build-dependencies]
cc = "1.0"
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "aoc_bench"
harness = false